<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f3ea" />
    <meta name="description" content="Meeting and talk preparation companion — weekly studies prepared, NWT scriptures, full talk generation. Personal tool, not affiliated with JW.ORG." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="JW Talk" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <title>JW Study Assistant</title>
    <style>
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
              background: linear-gradient(180deg, #f7f3ea, #efe9dc); color: #1e2a4a;
              font-family: "Manrope", "Segoe UI", system-ui, sans-serif; font-weight: 800; }
      #boot .lamp { width: 54px; height: 54px; border-radius: 18px; display: grid; place-items: center;
              background: linear-gradient(135deg, #f2b95c, #e08f2a); color: #fff; font-size: 26px;
              box-shadow: 0 10px 26px rgba(232,161,61,.45); animation: bootpulse 1.6s ease-in-out infinite; }
      #boot .wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
      @keyframes bootpulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    </style>
  </head>
  <body>
    <div id="boot"><div class="wrap"><div class="lamp">📖</div><div>Opening your study…</div></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
